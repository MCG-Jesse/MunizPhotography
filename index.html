<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesse Muniz — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
 
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg: #0d0c0a;
    --text: #e0d8c4;
    --text-muted: #6a6255;
    --accent: #c9a84c;
    --accent-dim: rgba(201,168,76,0.2);
    --thumb-h: 90px;
    --nav-h: 60px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
 
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    user-select: none;
  }
 
  /* ── Full-screen photo stage ── */
  #stage {
    position: fixed;
    inset: 0;
    bottom: calc(var(--thumb-h) + 1px);
    background: var(--bg);
    overflow: hidden;
  }
 
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.7s var(--ease);
    display: flex;
    align-items: center;
    justify-content: center;
  }
 
  .slide.active { opacity: 1; }
  .slide.prev   { opacity: 0; }
 
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    filter: brightness(0.95);
  }
 
  /* ── Top navigation bar ── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-h);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    background: linear-gradient(to bottom, rgba(13,12,10,0.85) 0%, transparent 100%);
    transition: opacity 0.4s ease;
  }
 
  #topbar.hidden { opacity: 0; pointer-events: none; }
 
  .site-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--text);
    text-decoration: none;
  }
 
  .site-title span {
    font-size: 0.6rem;
    font-family: 'Jost', sans-serif;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-left: 0.75rem;
    vertical-align: middle;
  }
 
  .top-nav {
    display: flex;
    align-items: center;
    gap: 2rem;
  }
 
  .top-nav button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Jost', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
    padding: 0.25rem 0;
    border-bottom: 1px solid transparent;
  }
 
  .top-nav button:hover,
  .top-nav button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
 
  /* Portfolio dropdown */
  .portfolio-menu {
    position: relative;
  }
 
  .dropdown {
    position: absolute;
    top: calc(100% + 1rem);
    right: 0;
    background: rgba(13,12,10,0.96);
    border: 1px solid rgba(201,168,76,0.15);
    padding: 0.5rem 0;
    min-width: 180px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
 
  .portfolio-menu:hover .dropdown,
  .portfolio-menu.open .dropdown {
    opacity: 1;
    pointer-events: all;
  }
 
  .dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.55rem 1.25rem;
    border: none;
    border-bottom: none !important;
  }
 
  /* ── Caption overlay ── */
  #caption-bar {
    position: fixed;
    bottom: calc(var(--thumb-h) + 16px);
    left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 2.5rem 1rem;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
 
  #caption-bar.hidden { opacity: 0; }
 
  .caption-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    font-weight: 300;
    color: rgba(224,216,196,0.7);
    max-width: 50%;
  }
 
  .counter-text {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
  }
 
  /* ── Arrow controls ── */
  .arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    width: 50px;
    height: 50px;
    background: transparent;
    border: none;
    color: rgba(224,216,196,0.35);
    cursor: pointer;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
    margin-bottom: calc(var(--thumb-h) / 2);
  }
 
  .arrow:hover { color: rgba(224,216,196,0.85); }
  .arrow.left  { left: 1rem; }
  .arrow.right { right: 1rem; }
 
  /* ── Thumbnail strip ── */
  #thumb-strip {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--thumb-h);
    z-index: 100;
    background: rgba(13,12,10,0.92);
    border-top: 1px solid rgba(201,168,76,0.1);
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    gap: 3px;
    padding: 6px 6px;
  }
 
  #thumb-strip::-webkit-scrollbar { height: 3px; }
  #thumb-strip::-webkit-scrollbar-track { background: transparent; }
  #thumb-strip::-webkit-scrollbar-thumb { background: var(--accent-dim); }
 
  .thumb {
    flex-shrink: 0;
    height: calc(var(--thumb-h) - 12px);
    aspect-ratio: 3/2;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s ease, outline 0.2s ease;
    position: relative;
  }
 
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.7);
    transition: filter 0.3s ease;
  }
 
  .thumb:hover { opacity: 0.75; }
  .thumb:hover img { filter: saturate(1); }
 
  .thumb.active {
    opacity: 1;
    outline: 1.5px solid var(--accent);
    outline-offset: -1.5px;
  }
 
  .thumb.active img { filter: saturate(1); }
 
  /* ── Empty state ── */
  #empty {
    position: fixed;
    inset: 0;
    bottom: var(--thumb-h);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-align: center;
  }
 
  #empty svg {
    width: 48px; height: 48px;
    stroke: var(--accent); fill: none;
    opacity: 0.25; stroke-width: 1; stroke-linecap: round;
  }
 
  #empty h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem; font-weight: 300;
    opacity: 0.35;
  }
 
  #empty p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.8; }
 
  /* ── Hide UI on mouse idle ── */
  body.ui-hidden #topbar,
  body.ui-hidden #caption-bar { opacity: 0; pointer-events: none; }
 
  body.ui-hidden .arrow { color: rgba(224,216,196,0.1); }
 
  /* ── Responsive ── */
  @media (max-width: 640px) {
    :root { --thumb-h: 70px; }
    .caption-text { font-size: 0.9rem; max-width: 70%; }
    .top-nav { gap: 1rem; }
  }
</style>
</head>
<body>
 
<!-- Top nav -->
<div id="topbar">
  <a class="site-title" href="#">Jesse <span>Photography</span></a>
  <div class="top-nav">
    <div class="portfolio-menu">
      <button id="portfolio-btn">Portfolios ▾</button>
      <div class="dropdown" id="portfolio-dropdown"></div>
    </div>
    <button onclick="toggleInfo()">Info</button>
  </div>
</div>
 
<!-- Main stage -->
<div id="stage"></div>
 
<!-- Empty state -->
<div id="empty" style="display:none">
  <svg viewBox="0 0 64 64">
    <rect x="4" y="12" width="56" height="40" rx="3"/>
    <circle cx="32" cy="32" r="10"/>
    <circle cx="32" cy="32" r="4"/>
    <circle cx="50" cy="20" r="2"/>
  </svg>
  <h2>No photos yet</h2>
  <p>Add images and list them in photos.json</p>
</div>
 
<!-- Caption + counter -->
<div id="caption-bar">
  <span class="caption-text" id="caption"></span>
  <span class="counter-text" id="counter"></span>
</div>
 
<!-- Arrows -->
<button class="arrow left" onclick="shift(-1)">&#8592;</button>
<button class="arrow right" onclick="shift(1)">&#8594;</button>
 
<!-- Thumbnail strip -->
<div id="thumb-strip"></div>
 
<script>
  let allPhotos = [], filtered = [], current = 0;
  let idleTimer = null;
 
  async function init() {
    try {
      const res = await fetch('photos.json');
      allPhotos = await res.json();
    } catch(e) { allPhotos = []; }
 
    // Build portfolio dropdown from categories
    const cats = [...new Set(allPhotos.map(p => p.category).filter(Boolean))];
    const dd = document.getElementById('portfolio-dropdown');
    const btn = document.getElementById('portfolio-btn');
 
    if (cats.length) {
      const allBtn = document.createElement('button');
      allBtn.textContent = 'All';
      allBtn.onclick = () => { filterBy('all'); dd.style.opacity = 0; dd.style.pointerEvents = 'none'; };
      dd.appendChild(allBtn);
 
      cats.forEach(cat => {
        const b = document.createElement('button');
        b.textContent = cat;
        b.onclick = () => { filterBy(cat); dd.style.opacity = 0; dd.style.pointerEvents = 'none'; };
        dd.appendChild(b);
      });
 
      btn.onclick = () => {
        const open = dd.style.opacity === '1';
        dd.style.opacity = open ? '0' : '1';
        dd.style.pointerEvents = open ? 'none' : 'all';
      };
    } else {
      btn.style.display = 'none';
    }
 
    filterBy('all');
    setupIdleHide();
  }
 
  function filterBy(cat) {
    filtered = cat === 'all' ? [...allPhotos] : allPhotos.filter(p => p.category === cat);
    current = 0;
    buildStage();
    buildThumbs();
    updateCaption();
  }
 
  function buildStage() {
    const stage = document.getElementById('stage');
    const empty = document.getElementById('empty');
 
    if (filtered.length === 0) {
      stage.innerHTML = '';
      empty.style.display = 'flex';
      return;
    }
 
    empty.style.display = 'none';
    stage.innerHTML = filtered.map((p, i) => `
      <div class="slide ${i === 0 ? 'active' : ''}" data-i="${i}">
        <img src="${p.file}" alt="${p.caption || ''}" loading="${i < 3 ? 'eager' : 'lazy'}">
      </div>
    `).join('');
  }
 
  function buildThumbs() {
    const strip = document.getElementById('thumb-strip');
    strip.innerHTML = filtered.map((p, i) => `
      <div class="thumb ${i === 0 ? 'active' : ''}" data-i="${i}" onclick="goTo(${i})">
        <img src="${p.file}" alt="" loading="lazy">
      </div>
    `).join('');
  }
 
  function goTo(i) {
    if (i === current) return;
    const slides = document.querySelectorAll('.slide');
    const thumbs = document.querySelectorAll('.thumb');
 
    slides[current]?.classList.remove('active');
    thumbs[current]?.classList.remove('active');
 
    current = (i + filtered.length) % filtered.length;
 
    slides[current]?.classList.add('active');
    thumbs[current]?.classList.add('active');
 
    // Scroll thumb into view
    thumbs[current]?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
 
    updateCaption();
  }
 
  function shift(dir) {
    goTo(current + dir);
  }
 
  function updateCaption() {
    const p = filtered[current];
    document.getElementById('caption').textContent = p?.caption || '';
    document.getElementById('counter').textContent =
      filtered.length ? `${current + 1} / ${filtered.length}` : '';
  }
 
  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  shift(-1);
    if (e.key === 'ArrowRight') shift(1);
  });
 
  // Touch swipe
  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) shift(dx < 0 ? 1 : -1);
    touchX = null;
  });
 
  // Hide UI when mouse idle
  function setupIdleHide() {
    const resetIdle = () => {
      document.body.classList.remove('ui-hidden');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 3500);
    };
    document.addEventListener('mousemove', resetIdle);
    document.addEventListener('touchstart', resetIdle);
    resetIdle();
  }
 
  function toggleInfo() {
    // Placeholder for info panel
    alert('Coming soon — add your bio and contact info here.');
  }
 
  init();
</script>
</body>
</html>
