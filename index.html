<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesse — Photography</title>
<meta name="description" content="Photography by Jesse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
 
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg: #111009;
    --bg-card: #1a1810;
    --text: #e8dfc8;
    --text-muted: #7a7160;
    --accent: #c9a84c;
    --accent-dim: #6b5620;
    --border: rgba(201, 168, 76, 0.15);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
 
  html { scroll-behavior: smooth; }
 
  body {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
 
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 3.5rem 5rem 2.5rem;
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.7s var(--ease) both;
  }
 
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  .site-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 0.02em;
    line-height: 1;
  }
 
  .site-name em {
    display: block;
    font-style: normal;
    font-size: 0.78rem;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 0.45rem;
  }
 
  nav { display: flex; gap: 2.5rem; }
 
  nav a {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
 
  nav a:hover { color: var(--text); }
 
  .cat-bar {
    padding: 1.25rem 5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
  }
 
  .cat-bar::-webkit-scrollbar { display: none; }
 
  .cat-btn {
    padding: 0.38rem 1.1rem;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
 
  .cat-btn:hover { color: var(--text); }
  .cat-btn.active {
    border-color: var(--border);
    color: var(--text);
    background: var(--bg-card);
  }
 
  .photo-count {
    margin-left: auto;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    flex-shrink: 0;
  }
 
  main {
    padding: 0 5rem 5rem;
    animation: fadeUp 0.8s 0.15s var(--ease) both;
  }
 
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 55vh;
    text-align: center;
    gap: 1.5rem;
  }
 
  .empty-icon {
    width: 56px; height: 56px;
    stroke: var(--accent); fill: none;
    opacity: 0.3; stroke-width: 1; stroke-linecap: round;
  }
 
  .empty h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem; font-weight: 300; opacity: 0.4;
  }
 
  .empty p { font-size: 0.82rem; color: var(--text-muted); max-width: 340px; line-height: 1.8; }
 
  /* Hero */
  .hero {
    position: relative;
    width: 100%;
    margin-top: 3rem;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-card);
  }
 
  .hero img {
    width: 100%;
    max-height: 72vh;
    object-fit: cover;
    display: block;
    transition: transform 0.7s var(--ease), filter 0.5s ease;
    filter: brightness(0.88) saturate(0.9);
  }
 
  .hero:hover img {
    transform: scale(1.02);
    filter: brightness(0.95) saturate(1);
  }
 
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(8,7,5,0.75) 0%, transparent 50%);
    display: flex;
    align-items: flex-end;
    padding: 2.5rem 3rem;
  }
 
  .hero-meta { display: flex; flex-direction: column; gap: 0.4rem; }
 
  .hero-label {
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
  }
 
  .hero-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    font-style: italic;
    color: var(--text);
    line-height: 1.2;
  }
 
  .hero-expand {
    position: absolute;
    top: 1.25rem; right: 1.25rem;
    width: 36px; height: 36px;
    background: rgba(8,7,5,0.5);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
 
  .hero:hover .hero-expand { opacity: 1; }
 
  /* Thumbnails */
  .thumb-section { margin-top: 10px; }
 
  .thumb-section-label {
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
 
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
 
  .thumb-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-card);
    aspect-ratio: 4/3;
  }
 
  .thumb-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s var(--ease), filter 0.4s ease;
    filter: brightness(0.85) saturate(0.85);
  }
 
  .thumb-item:hover img {
    transform: scale(1.06);
    filter: brightness(1) saturate(1);
  }
 
  .thumb-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(8,7,5,0.65) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex; align-items: flex-end;
    padding: 0.75rem;
  }
 
  .thumb-item:hover .thumb-overlay { opacity: 1; }
 
  .thumb-caption {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: rgba(232,223,200,0.85);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
 
  .thumb-item.is-hero::after {
    content: 'Featured';
    position: absolute;
    top: 8px; left: 8px;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(8,7,5,0.7);
    border: 1px solid var(--accent-dim);
    padding: 3px 8px;
  }
 
  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(8,7,5,0.97);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
 
  .lb.open { opacity: 1; pointer-events: all; }
 
  .lb-inner {
    display: flex; flex-direction: column;
    align-items: center; gap: 1.25rem;
    max-width: 88vw;
  }
 
  .lb img {
    max-width: 88vw; max-height: 82vh;
    object-fit: contain; display: block;
    transition: opacity 0.25s ease;
  }
 
  .lb-meta { display: flex; align-items: center; gap: 2rem; }
 
  .lb-caption {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.05rem;
    color: rgba(232,223,200,0.6);
  }
 
  .lb-counter { font-size: 0.68rem; letter-spacing: 0.2em; color: var(--text-muted); }
 
  .lb-close {
    position: fixed; top: 1.75rem; right: 2.25rem;
    width: 38px; height: 38px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; z-index: 1001;
  }
 
  .lb-close:hover { color: var(--text); border-color: var(--accent-dim); }
 
  .lb-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; z-index: 1001; user-select: none;
  }
 
  .lb-arrow:hover { color: var(--text); border-color: var(--accent-dim); }
  .lb-arrow.prev { left: 2rem; }
  .lb-arrow.next { right: 2rem; }
 
  footer {
    padding: 2rem 5rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
 
  footer p { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--text-muted); }
  footer .gold { color: var(--accent); }
 
  @media (max-width: 960px) {
    header, .cat-bar, main, footer { padding-left: 2rem; padding-right: 2rem; }
    .thumb-grid { grid-template-columns: repeat(3, 1fr); }
    .site-name { font-size: 2.2rem; }
  }
 
  @media (max-width: 640px) {
    header { flex-direction: column; align-items: flex-start; gap: 1.5rem; padding-top: 2rem; }
    .thumb-grid { grid-template-columns: repeat(2, 1fr); }
    .hero-caption { font-size: 1.4rem; }
    .lb-arrow.prev { left: 0.75rem; }
    .lb-arrow.next { right: 0.75rem; }
  }
</style>
</head>
<body>
 
<header>
  <div class="site-name">Jesse<em>Photography</em></div>
  <nav></nav>
</header>
 
<div class="cat-bar">
  <button class="cat-btn active" data-cat="all" onclick="filterBy('all')">All</button>
  <span id="extra-cats"></span>
  <span class="photo-count" id="photo-count"></span>
</div>
 
<main>
  <div class="empty" id="empty" style="display:none">
    <svg class="empty-icon" viewBox="0 0 64 64">
      <rect x="4" y="12" width="56" height="40" rx="3"/>
      <circle cx="32" cy="32" r="10"/>
      <circle cx="32" cy="32" r="4"/>
      <circle cx="50" cy="20" r="2"/>
    </svg>
    <h2>No photos yet</h2>
    <p>Add your images and list them in photos.json.</p>
  </div>
 
  <div class="hero" id="hero" style="display:none" onclick="openLb(0)">
    <img id="hero-img" src="" alt="">
    <div class="hero-overlay">
      <div class="hero-meta">
        <span class="hero-label">Featured</span>
        <span class="hero-caption" id="hero-caption"></span>
      </div>
    </div>
    <div class="hero-expand">&#x2922;</div>
  </div>
 
  <div class="thumb-section" id="thumb-section" style="display:none">
    <p class="thumb-section-label">All photos</p>
    <div class="thumb-grid" id="thumb-grid"></div>
  </div>
</main>
 
<div class="lb" id="lb">
  <div class="lb-inner">
    <img id="lb-img" src="" alt="">
    <div class="lb-meta">
      <span class="lb-caption" id="lb-caption"></span>
      <span class="lb-counter" id="lb-counter"></span>
    </div>
  </div>
  <button class="lb-close" onclick="closeLb()">&#x2715;</button>
  <button class="lb-arrow prev" onclick="shiftLb(-1)">&#x2190;</button>
  <button class="lb-arrow next" onclick="shiftLb(1)">&#x2192;</button>
</div>
 
<footer>
  <p>&#169; <span id="yr"></span> <span class="gold">Jesse</span></p>
  <p>Click any photo to view &mdash; arrow keys to navigate</p>
</footer>
 
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
 
  let allPhotos = [], filtered = [], current = 0;
 
  async function init() {
    try {
      const res = await fetch('photos.json');
      allPhotos = await res.json();
    } catch(e) { allPhotos = []; }
 
    const cats = new Set();
    allPhotos.forEach(p => { if (p.category) cats.add(p.category); });
 
    const container = document.getElementById('extra-cats');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.onclick = () => filterBy(cat);
      container.appendChild(btn);
    });
 
    filterBy('all');
  }
 
  function filterBy(cat) {
    document.querySelectorAll('.cat-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.cat === cat));
    filtered = cat === 'all' ? [...allPhotos] : allPhotos.filter(p => p.category === cat);
    render();
  }
 
  function render() {
    const count = document.getElementById('photo-count');
    const hero = document.getElementById('hero');
    const thumbSection = document.getElementById('thumb-section');
    const empty = document.getElementById('empty');
 
    count.textContent = filtered.length + (filtered.length === 1 ? ' photo' : ' photos');
 
    if (filtered.length === 0) {
      hero.style.display = 'none';
      thumbSection.style.display = 'none';
      empty.style.display = 'flex';
      return;
    }
 
    empty.style.display = 'none';
 
    const first = filtered[0];
    hero.style.display = 'block';
    document.getElementById('hero-img').src = first.file;
    document.getElementById('hero-caption').textContent = first.caption || '';
 
    thumbSection.style.display = filtered.length > 1 ? 'block' : 'none';
 
    document.getElementById('thumb-grid').innerHTML = filtered.map((p, i) => `
      <div class="thumb-item ${i === 0 ? 'is-hero' : ''}" onclick="openLb(${i})">
        <img src="${p.file}" alt="${p.caption || ''}" loading="lazy">
        <div class="thumb-overlay">
          ${p.caption ? `<span class="thumb-caption">${p.caption}</span>` : ''}
        </div>
      </div>
    `).join('');
  }
 
  function openLb(i) {
    current = i;
    updateLb();
    document.getElementById('lb').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeLb() {
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  }
 
  function updateLb() {
    const p = filtered[current];
    const img = document.getElementById('lb-img');
    img.style.opacity = 0;
    img.src = p.file;
    img.onload = () => img.style.opacity = 1;
    document.getElementById('lb-caption').textContent = p.caption || '';
    document.getElementById('lb-counter').textContent = `${current + 1} / ${filtered.length}`;
  }
 
  function shiftLb(dir) {
    current = (current + dir + filtered.length) % filtered.length;
    updateLb();
  }
 
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lb').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') shiftLb(-1);
    if (e.key === 'ArrowRight') shiftLb(1);
  });
 
  document.getElementById('lb').addEventListener('click', e => {
    if (e.target === document.getElementById('lb')) closeLb();
  });
 
  init();
</script>
</body>
</html>
